add_newline = true
command_timeout = 3000

[character]
success_symbol = "🍡"
error_symbol = "👹"

[line_break]
disabled = false

[status]
disabled = false

[time]
disabled = false
time_format = "%m%dT%H:%M:%S"
format = "🕘[$time]($style)"

[directory]
truncation_symbol = ".../"

[git_branch]
symbol = "🌱"

[gcloud]
style = "bold yellow"
symbol = "🇬️ " 
format = " [$symbol$active]($style) "

[gcloud.region_aliases]
asia-northeast1 = 'jp'
us-central1 = ''

[golang]
format = "$directory[$symbol$version](bold cyan) "

[aws]
style = "bold blue"
symbol = "🅰 "
format = " [$symbol($profile)($region)]($style)"

[aws.region_aliases]
ap-northeast-1 = 'apne1'
ap-northeast-2 = 'apne2'
ap-northeast-3 = 'apne3'
ap-east-1 = 'ape1'
ap-southeast-1 = 'apse1'
ap-southeast-2 = 'apse2'
ap-southeast-3 = 'apse3'
ap-southeast-4 = 'apse4'
ap-southeast-5 = 'apse5'
us-east-1 = 'use1'
us-east-2 = 'use2'
us-west-1 = 'usw1'
us-west-2 = 'usw2'
ap-south-1 = 'aps1'
ap-south-2 = 'aps2'
sa-east-1 = 'sae1'
eu-west-1 = 'euw1'
eu-west-2 = 'euw2'
eu-west-3 = 'euw3'
eu-central-1 = 'euc1'
